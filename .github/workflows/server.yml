# Server (container image). Runs when server files change.
#   - every push / pull request: type-check, compose files + entrypoint lint, end-to-end tests against the built container
#     (started from .env.example with the hardened flags), container smoke test (tests/docker_smoke.sh)
#   - tag server-X.Y.Z (scripts/version.py bump X.Y.Z server, CHANGELOG.md section, commit, tag, push): the tests, then
#     image ghcr.io/<owner>/cloudy:X.Y.Z and :latest. No GitHub release: what changed for admins is in CHANGELOG.md.
#     The tag must match server/package.json (scripts/version.py check). An image that is already there is not rebuilt.
name: Server

on:
  push:
    branches: [main]
    tags: ['server-[0-9]*'] # a release (path filters don't apply to tags)
    paths: &paths
      - 'server/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'tests/e2e.py'
      - 'tests/docker_smoke.sh'
      - 'scripts/version.py'
      - 'scripts/published.mjs'
      - '.github/workflows/server.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-server-${{ github.ref }}

# Read-only token by default; publish/release jobs ask for more themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Release tag matches the version in the files
        if: github.ref_type == 'tag'
        run: python3 scripts/version.py check "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Type-check and unit tests
        working-directory: server
        run: npm ci && npm run typecheck && npm test
      - name: Compose files and entrypoint
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f deploy/docker-compose.yml config -q
          shellcheck server/docker/entrypoint.sh tests/docker_smoke.sh
      - name: Start stack (.env.example with a real admin password, hardened flags)
        run: |
          sed -i 's/^CLOUDY_ADMIN_PASSWORD=.*/CLOUDY_ADMIN_PASSWORD=ci-admin-password/' .env
          docker compose -f deploy/docker-compose.yml up -d --build --wait
      - name: End-to-end tests
        run: |
          # The email tests run a fake SMTP server on this machine; the container reaches it via its network gateway.
          export CLOUDY_TEST_SMTP_HOST=$(docker inspect cloudy -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')
          python3 tests/e2e.py http://localhost:8080 admin ci-admin-password
      - name: Container smoke test (PUID, capabilities, restart, stop, old .env files)
        run: tests/docker_smoke.sh cloudy:local
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs cloudy

  publish:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          echo "version=$(scripts/version.py get server)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudy" >> "$GITHUB_OUTPUT"
      - name: Already published? (a re-run after a partly failed release)
        id: done
        run: |
          rc=0; GHCR_IMAGE="${GITHUB_REPOSITORY_OWNER,,}/cloudy" node scripts/published.mjs server "${{ steps.v.outputs.version }}" || rc=$?
          [ $rc != 2 ] || exit 1
          [ $rc != 0 ] || echo "skip=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: steps.done.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.done.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.done.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.done.outputs.skip != 'true'
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
