# Android app (Google Play). Runs when android/ changes.
#   - every push / pull request: debug build
#   - tag android-X.Y.Z (must match versionName, scripts/version.py check): signed bundle → Play closed-testing track
#     (test it, then promote it to production by hand in Play Console). No GitHub release. A versionCode already on Play is skipped.
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of android/cloudy-release.keystore), ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON (Play Developer API service account key).
# Release notes: android/whatsnew/whatsnew-en-US (one file per Play listing language; update it with each version bump).
# Variables (optional): PLAY_TRACK (default "alpha" = closed testing; "internal" = internal testing, "production"), PLAY_RELEASE_STATUS (default "completed").
# Without the secrets the publish job fails (the bundle, if built, is in the workflow artifacts), so the run fails.
name: Android

on:
  push:
    branches: [main]
    tags: ['android-[0-9]*'] # a release (path filters don't apply to tags)
    paths: &paths
      - 'android/**'
      - 'scripts/version.py'
      - 'scripts/published.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-android-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Release tag matches the version in the files
        if: github.ref_type == 'tag'
        run: python3 scripts/version.py check "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }} # secrets can't be tested in `if` directly
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "version=$(scripts/version.py get android)" >> "$GITHUB_OUTPUT"
          [ -n "$KEYSTORE" ] || { echo "::error::No signing secrets: Android $(scripts/version.py get android) can't be published."; exit 1; }
      - name: Already published? (a re-run after a partly failed release)
        id: done
        if: env.PLAY_JSON != ''
        run: |
          rc=0; node scripts/published.mjs android "$(scripts/version.py build android)" || rc=$?
          [ $rc != 2 ] || exit 1
          [ $rc != 0 ] || echo "skip=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.done.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        if: steps.done.outputs.skip != 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build signed Play bundle
        if: steps.done.outputs.skip != 'true'
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > cloudy-release.keystore
          printf 'storeFile=cloudy-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > keystore.properties
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "Cloudy-${{ steps.v.outputs.version }}.aab"
      - uses: actions/upload-artifact@v5
        if: steps.done.outputs.skip != 'true'
        with:
          name: play-bundle
          path: |
            android/Cloudy-*.aab
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Upload to Google Play
        if: steps.done.outputs.skip != 'true' && (env.PLAY_JSON != '')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.cloudy.app
          releaseFiles: android/Cloudy-*.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: android/whatsnew # "What's new" per language: whatsnew-<locale>, max 500 characters
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Not uploaded
        if: steps.done.outputs.skip != 'true' && (env.PLAY_JSON == '')
        run: |
          echo "::error::PLAY_SERVICE_ACCOUNT_JSON not set. The bundle is in the workflow artifacts; upload it in Play Console."
          exit 1
