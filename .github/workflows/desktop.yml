# Desktop sync app (Electron: macOS, Windows, Linux). Runs when desktop/ changes.
#   - every push / pull request: type-check, sync tests against a Cloudy server run from server/, packages for all three
#   - called by release.yml (publish: true) when a release includes the desktop app: macOS signed with the Developer ID
#     certificates and notarized. release.yml then tags vX.Y.Z and makes the GitHub release with every package (the
#     desktop-* artifacts) and the latest*.yml files the installed apps update from (desktop/src/main/updater.ts).
# Secrets (macOS signing): MACOS_CERTIFICATE_P12 (Developer ID Application, base64 .p12), MACOS_INSTALLER_CERTIFICATE_P12
#   (Developer ID Installer, for the .pkg), MACOS_CERTIFICATE_PASSWORD (both .p12 files), and the App Store Connect API key
#   APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_P8 (role Developer or higher) for notarization.
# Windows and Linux packages are unsigned.
name: Desktop

on:
  push:
    branches: [main]
    paths: &paths
      - 'desktop/**'
      - 'scripts/version.py'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call: # from release.yml
    inputs:
      publish:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-desktop-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloudy
          POSTGRES_PASSWORD: cloudy
          POSTGRES_DB: cloudy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json
      - name: Start a Cloudy server
        run: |
          cd server && npm ci --omit=dev
          mkdir -p "$RUNNER_TEMP/data"
          PORT=8080 DATA_DIR="$RUNNER_TEMP/data" DATABASE_URL=postgres://cloudy:cloudy@localhost:5432/cloudy \
            ADMIN_USER=admin ADMIN_PASSWORD=ci-admin-password nohup node src/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do curl -fs http://localhost:8080/api/auth/options >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Type-check and sync tests
        working-directory: desktop
        env:
          CLOUDY_TEST_URL: http://localhost:8080
          CLOUDY_TEST_USER: admin
          CLOUDY_TEST_PASSWORD: ci-admin-password
        run: |
          npm ci
          npm run typecheck
          npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - id: v
        run: echo "release=${{ inputs.publish && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: desktop

      # Release builds only: both Developer ID certificates go into a throwaway keychain for this run, with Apple's
      # intermediates so the chain to the root is complete. electron-builder then finds them by name.
      - name: Import signing certificates
        if: matrix.target == 'mac' && steps.v.outputs.release == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE_P12" ] || { echo "::error::The MACOS_CERTIFICATE_P12 secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for p12 in MACOS_CERTIFICATE_P12 MACOS_INSTALLER_CERTIFICATE_P12; do
            [ -n "${!p12}" ] || continue
            printf '%s' "${!p12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/cert.p12"
          done
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$NAME" ] || { security find-identity -p codesigning "$KEYCHAIN"; echo "::error::No valid Developer ID Application identity"; exit 1; }
          echo "CSC_NAME=${NAME#Developer ID Application: }" >> "$GITHUB_ENV"

      - name: Build packages
        working-directory: desktop
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ "${{ matrix.target }}" = mac ] && [ "$RELEASE" = true ]; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" # for the notarize step below
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false # unsigned test build
          fi
          npm run dist:${{ matrix.target }} -- --publish never

      # Notarizing the .dmg and .pkg also notarizes the apps inside (Apple records every nested binary), which covers
      # the .zip used for updates too: it holds the same app as the .dmg of its architecture. Stapling is retried
      # because Apple publishes a new ticket with a delay.
      - name: Notarize .dmg and .pkg
        if: matrix.target == 'mac' && steps.v.outputs.release == 'true'
        working-directory: desktop/dist
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          for f in *.dmg *.pkg; do
            xcrun notarytool submit "$f" --key "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait \
              | tee notarize.log
            grep -q 'status: Accepted' notarize.log || { echo "::error::Notarization of $f was not accepted"; exit 1; }
            for try in 1 2 3 4 5 6; do xcrun stapler staple "$f" && break; [ $try = 6 ] && exit 1; sleep 30; done
          done
          rm notarize.log
          # The apps in the .zip files are now notarized too (checked online, as Gatekeeper does for a download).
          for z in *.zip; do
            rm -rf check && mkdir check && ditto -x -k "$z" check
            spctl --assess --type execute -vv check/*.app
          done
          rm -rf check
          spctl --assess --type install -vv *.pkg
          spctl --assess --type open --context context:primary-signature -vv *.dmg

      - name: Remove signing keychain
        if: always() && matrix.target == 'mac'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.pkg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

