# iOS app (App Store). Runs when ios/ changes.
#   - every push / pull request: unsigned simulator build
#   - push to main with an unreleased MARKETING_VERSION (scripts/version.py bump ios X.Y.Z): signed build uploaded to
#     App Store Connect → TestFlight (submit it for App Review by hand), then tag ios-vX.Y.Z. No GitHub release (only the desktop app has those).
# Secrets: APPLE_TEAM_ID, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8
#   (contents of AuthKey_<id>.p8; exposed to the steps as ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY; App Store Connect →
#   Users and Access → Integrations → App Store Connect API, role Admin for cloud signing).
#   Optional IOS_CERTIFICATE_P12 (base64 of an "Apple Development" certificate + key exported from Keychain Access) and
#   IOS_CERTIFICATE_PASSWORD: with them Xcode signs the archive with that certificate instead of creating a new one on
#   every runner (Apple limits those: "Your account has reached the maximum number of certificates").
# Without them the release job does nothing and doesn't tag, so the version stays unreleased.
# Release notes: ios/whatsnew/en-US.txt (update it with each version bump) → TestFlight "What to Test" and, from the second
#   App Store version on, "What's New" if that version already exists in App Store Connect (scripts/appstore-whatsnew.mjs).
# macos-26 runner: App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or newer.
name: iOS

on:
  push:
    branches: [main]
    paths: &paths
      - 'ios/**'
      - 'scripts/version.py'
      - 'scripts/github-release.sh'
      - 'scripts/appstore-whatsnew.mjs'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for the simulator (unsigned)
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          ios/build.sh

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if scripts/version.py released ios; then
            echo "::notice::iOS $(scripts/version.py get ios) is already released. Run scripts/version.py bump ios X.Y.Z to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::warning::No App Store Connect API key secrets: iOS $(scripts/version.py get ios) not uploaded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Development certificate (optional secret, avoids creating one per runner)
        if: steps.v.outputs.skip != 'true'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$IOS_CERTIFICATE_P12" ] || { echo "No IOS_CERTIFICATE_P12 secret: Xcode will create a development certificate."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/ios.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" || { echo "::error::IOS_CERTIFICATE_P12 holds no Apple Development identity"; exit 1; }
      - name: Archive and upload to App Store Connect
        if: steps.v.outputs.skip != 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          ios/build.sh upload
      - name: Release notes (TestFlight "What to Test", App Store "What's New")
        if: steps.v.outputs.skip != 'true'
        continue-on-error: true # optional: the build is already uploaded
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          node scripts/appstore-whatsnew.mjs io.cloudy.app "$(scripts/version.py get ios)" "$(scripts/version.py build ios)" ios/whatsnew/en-US.txt
      - name: Tag (no GitHub release)
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/github-release.sh ios --tag-only
