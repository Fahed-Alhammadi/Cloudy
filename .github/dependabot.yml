# Dependabot: weekly dependency updates for every product, plus security updates (enabled in repo settings).
# Minor/patch updates are grouped into one PR per folder; major updates come as their own PRs.
# Merging an update only runs CI — nothing is released until a <product>-X.Y.Z tag is pushed.
version: 2

updates:
  # Server (Node/TypeScript)
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "Server deps" }
    groups:
      server-minor:
        update-types: [minor, patch]

  # Server container base image (node:24-trixie-slim). The Node major is a deliberate choice: no major bumps.
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "Server image" }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Desktop app (Electron)
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "Desktop deps" }
    groups:
      desktop-minor:
        update-types: [minor, patch]

  # Android app (Gradle: AGP, Kotlin, Compose, AndroidX, …)
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "Android deps" }
    groups:
      android-minor:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "CI" }
    groups:
      actions:
        patterns: ["*"]
