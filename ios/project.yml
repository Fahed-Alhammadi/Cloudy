# XcodeGen spec: `xcodegen generate` (or ./build.sh) writes Cloudy.xcodeproj, which is git-ignored.
name: Cloudy
options:
  bundleIdPrefix: io.cloudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "JEXQBK3SQ5"          # your Apple Team ID (or pick the team in Xcode → Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
targets:
  Cloudy:
    type: application
    platform: iOS
    sources:
      - path: Cloudy
    dependencies:
      - target: CloudyShare
        embed: true
    entitlements:
      path: Cloudy/Cloudy.entitlements
      properties:
        com.apple.security.application-groups: [group.io.cloudy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)io.cloudy.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cloudy.app
        PRODUCT_NAME: Cloudy
        INFOPLIST_FILE: Cloudy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # "Share to Cloudy" in other apps' share sheets: uploads the shared files with the app's device token.
  CloudyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CloudyShare
      - path: Cloudy/Data/API.swift
      - path: Cloudy/Data/Models.swift
      - path: Cloudy/Data/Keychain.swift
      - path: Cloudy/Resources/Localizable.xcstrings
    entitlements:
      path: CloudyShare/CloudyShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.cloudy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)io.cloudy.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cloudy.app.share
        PRODUCT_NAME: CloudyShare
        INFOPLIST_FILE: CloudyShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
