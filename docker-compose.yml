name: cloudy

services:
  cloudy:
    image: ghcr.io/fahed-alhammadi/cloudy:latest
    container_name: cloudy
    restart: unless-stopped
    ports:
      - "8080:8080"                 # behind a reverse proxy on this host: "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - app-data:/data              # your files; or a host folder, e.g. /mnt/cloudy:/data (NFS is fine)
      - db-data:/var/lib/cloudy/db  # the database; or a host folder on a local disk (not NFS)
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]  # used only at startup to switch to PUID/PGID

volumes:
  app-data:
  db-data:
